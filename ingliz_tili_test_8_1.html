<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingliz Tili 8-sinf — Test (1-chorak)</title>
<style>
:root{
  --bg:#e6f6ff;
  --panel:#ffffff;
  --accent:#0b66ff;
  --dark:#012a4a;
  --muted:#334155;
  --card-radius:12px;
  --ballB:#0b66ff;
  --ballQ:#22c55e;
  --ballM:#ef4444;
}
html,body{height:100%;margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--muted)}
.wrap{max-width:920px;margin:28px auto;padding:18px}
.school-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;}
.school-title{font-size:28px;line-height:1;color:var(--dark);font-weight:800;letter-spacing:0.6px;text-shadow:0 2px 0 rgba(255,255,255,0.5);}
.school-sub{font-size:13px;color:rgba(1,42,74,0.8);margin-top:4px}
.top-right{display:flex;flex-direction:column;align-items:flex-end;}
.timer{background:linear-gradient(90deg, rgba(11,102,255,0.12), rgba(11,102,255,0.06));border:1px solid rgba(11,102,255,0.14);padding:10px 14px;border-radius:10px;font-weight:700;color:var(--dark);font-size:18px;display:flex;gap:12px;align-items:center;min-width:140px;box-shadow:0 8px 20px rgba(2,6,23,0.06);}
.timer .time{font-size:20px}
.timer .label{font-size:12px;color:rgba(1,42,74,0.7)}
.card{background:var(--panel);border-radius:var(--card-radius);padding:22px;box-shadow:0 10px 30px rgba(2,6,23,0.06);}
.intro{text-align:center;padding:36px 20px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.4));margin-bottom:18px;}
label.input{display:block;margin-bottom:12px;font-weight:600;color:var(--dark)}
input[type="text"]{width:100%;padding:10px;border-radius:8px;border:1px solid #dbeafe;font-size:15px}
.controls{display:flex;gap:8px;align-items:center;margin-top:14px}
button{background:var(--accent);color:white;border:0;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(11,102,255,0.12);}
button.secondary{background:#64748b}
.navs{display:flex;gap:10px;align-items:center;margin-top:16px}
.qnum{font-weight:700;color:var(--dark)}
.question-text{font-size:18px;margin:6px 0 14px;color:#05263a}
.choices{display:flex;flex-direction:column;gap:10px}
.choice label{display:flex;gap:12px;align-items:center;cursor:pointer;padding:8px;border-radius:8px;border:1px solid #eef2ff}
input[type="radio"]{transform:scale(1.05)}
.footer-note{margin-top:10px;font-size:13px;color:rgba(1,42,74,0.8)}
@media (max-width:720px){.school-title{font-size:20px}.timer{font-size:15px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="school-header">
    <div>
      <div class="school-title">OLTIARIQ IXTISOSLASHTIRILGAN MAKTABI</div>
      <div class="school-sub">Ingliz tili — 8-sinf, 1-chorak</div>
    </div>
    <div class="top-right">
      <div id="timerBox" class="timer" style="width:250px;">
        <div>
          <div class="label">Qolgan vaqt</div>
          <div class="time" id="timeDisplay">37:30</div>
        </div>
        <div style="font-size:12px;color:rgba(1,42,74,0.6);">Savollar: <strong id="totalQs">15</strong></div>
      </div>
    </div>
  </div>

  <div class="card" id="mainCard">
    <div id="startScreen" class="intro">
      <h2 style="margin:0;color:var(--dark)">Testni boshlashdan oldin</h2>
      <p style="margin:8px 0 18px;color:rgba(1,42,74,0.75)">Iltimos ism va familiyangizni kiriting va “Testni boshlash” tugmasini bosing.</p>
      <div style="max-width:560px;margin:0 auto;">
        <label class="input">Ism<input id="firstName" type="text" placeholder="Ismingiz" /></label>
        <label class="input">Familiya<input id="lastName" type="text" placeholder="Familiyangiz" /></label>
        <div class="controls" style="justify-content:center">
          <button id="beginBtn">Testni boshlash</button>
          <button id="demoBtn" class="secondary">Namuna ko'rish (demo)</button>
        </div>
      </div>
    </div>

    <div id="testArea" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="qnum">Savol <span id="currentNum">1</span> / <span id="totalNum">15</span></div>
        <div style="text-align:right" class="footer-note">Har savolning ball turi matnda ko‘rsatilgan</div>
      </div>
      <hr style="border:none;height:12px">
      <div id="questionCard"></div>
      <div class="navs">
        <div>
          <button id="prevBtn" class="secondary">◀ Oldingi</button>
          <button id="nextBtn">Keyingi ▶</button>
        </div>
        <div style="margin-left:auto;display:flex;gap:10px;align-items:center">
          <button id="finishBtn" style="background:#ef4444">Testni tugatish</button>
          <div class="footer-note">Jami ball: <strong id="scorePreview">0</strong></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const QUESTIONS = [
{ id:1,text:"Choose the correct answer. In the summer, my family often has a ___ in the garden.",choices:["Noodle","sandwich","barbecue","omelette"],correct:2,ballLabel:"B",ballValue:2},
{ id:2,text:"Choose the correct answer. The laptop doesn’t have enough ___ to save all my videos.",choices:["Memory","charger","tablet","network"],correct:0,ballLabel:"B",ballValue:2},
{ id:3,text:"Choose the correct answer. He fell off his bike and now he has a ___ arm.",choices:["Ache","long","pain","broken"],correct:3,ballLabel:"B",ballValue:2},
{ id:4,text:"Choose the correct answer. The surgeon works in a small ___ in my town.",choices:["Market","clinic","factor","museum"],correct:1,ballLabel:"B",ballValue:2},
{ id:5,text:"Choose the correct answer. My house is ___ than my friend’s house because it has three floors.",choices:["Bigger","big","biggest","more big"],correct:0,ballLabel:"Q",ballValue:2.8},
{ id:6,text:"Which sentence is INCORRECT? A) This mountain is higher than that hill. B) The train is quicker than the bus. C)The movie was boringer than the book. D)My car is more modern than my old one.",choices:["A","B","C","D"],correct:2,ballLabel:"Q",ballValue:2.8},
{ id:7,text:"Choose the correct answer. This book is ___ than the one I read last week; I can’t stop reading it.",choices:["more interesting","interesting","most interesting","interestinger"],correct:0,ballLabel:"Q",ballValue:2.8},
{ id:8,text:"Choose the correct answer. My house is smaller than yours. It is ___ yours.",choices:["as bigger as","as big as","not as big as","not so bigger as"],correct:2,ballLabel:"Q",ballValue:2.8},
{ id:9,text:"Choose the correct version. Incorrect sentence: My house is as bigger as yours.",choices:["My house is not big as yours.","My house is not as bigger as yours.","My house is bigger as yours.","My house is as big as yours."],correct:3,ballLabel:"Q",ballValue:2.8},
{ id:10,text:"Choose the correct answer. This shop sells ___ clothes in the city.",choices:["the most expensive","expensive","more expensive","expensivest"],correct:0,ballLabel:"Q",ballValue:2.8},
{ id:11,text:"Choose the correct sentence. A)This shop sells the most cheap clothes in town. B)This shop sells the cheapest clothes in town. C)This shop sells cheapestest clothes in town. D)This shop sells more cheapest clothes in town.",choices:["A","B","C","D"],correct:1,ballLabel:"Q",ballValue:2.8},
{ id:12,text:"Choose the correct answer. This restaurant is ___ in town. Everyone loves it.",choices:["popularest","more popular","the more popular","the most popular"],correct:3,ballLabel:"Q",ballValue:2.8},
{ id:13,text:"Choose the correct answer. The water is dirty. You ___ drink it.",choices:["shouldn’t","should","should to","shouldn’t to"],correct:0,ballLabel:"Q",ballValue:2.8},
{ id:14,text:"Choose the correct answer. A: I’m feeling very tired today. B: You ___ go to bed earlier tonight.",choices:["shouldn’t","should","should to","shouldn’t to"],correct:1,ballLabel:"Q",ballValue:2.8},
{ id:15,text:"Read the text and find INCORRECT statement. A)Danny's dad didn't have any dessert. B)There was a band playing music in the restaurant. C)They had to wait a long time to get their food. D)Danny's parents had to pay for his meal.",choices:["A","B","C","D"],correct:3,ballLabel:"M",ballValue:4}
];

let state = {name:{first:"",last:""},idx:0,answers:Array(QUESTIONS.length).fill(null),startedAt:null,totalSeconds:Math.round(2.5*60*QUESTIONS.length)};
const startScreen = document.getElementById('startScreen');
const beginBtn = document.getElementById('beginBtn');
const demoBtn = document.getElementById('demoBtn');
const firstNameInput = document.getElementById('firstName');
const lastNameInput = document.getElementById('lastName');
const testArea = document.getElementById('testArea');
const questionCard = document.getElementById('questionCard');
const currentNum = document.getElementById('currentNum');
const totalNum = document.getElementById('totalNum');
const totalQs = document.getElementById('totalQs');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const finishBtn = document.getElementById('finishBtn');
const scorePreview = document.getElementById('scorePreview');
const timerBox = document.getElementById('timerBox');
const timeDisplay = document.getElementById('timeDisplay');

totalNum.textContent=QUESTIONS.length;
totalQs.textContent=QUESTIONS.length;

(function adjustTimerWidth(){const base=140,extraPerQ=10;timerBox.style.width=Math.min(520,base+QUESTIONS.length*extraPerQ)+'px';})();

function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderQuestion(i){
  const q=QUESTIONS[i]; questionCard.innerHTML=''; 
  const wrapper=document.createElement('div');
  const qTitle=document.createElement('div'); qTitle.className='question-text';
  qTitle.innerHTML=`<strong>(${q.ballLabel}-${q.ballValue})</strong> ${escapeHtml(q.text)}`;
  wrapper.appendChild(qTitle);
  const choices=document.createElement('div'); choices.className='choices';
  q.choices.forEach((ch,ci)=>{
    const div=document.createElement('div'); div.className='choice';
    const checked=(state.answers[i]===ci)?'checked':'';
    div.innerHTML=`<label><input type="radio" name="q_${q.id}" value="${ci}" ${checked}/> <span>${String.fromCharCode(65+ci)}. ${escapeHtml(ch)}</span></label>`;
    choices.appendChild(div);
  });
  wrapper.appendChild(choices); questionCard.appendChild(wrapper);
  currentNum.textContent=i+1; updateScorePreview();
}

function saveCurrentSelection(){
  const radios=document.querySelectorAll(`#questionCard input[type=radio][name^='q_']`);
  radios.forEach(r=>{if(r.checked){state.answers[state.idx]=Number(r.value);}});
}

prevBtn.addEventListener('click',()=>{saveCurrentSelection(); if(state.idx>0){state.idx--; renderQuestion(state.idx);}});
nextBtn.addEventListener('click',()=>{saveCurrentSelection(); if(state.idx<QUESTIONS.length-1){state.idx++; renderQuestion(state.idx);}});

beginBtn.addEventListener('click',()=>{
  const f=firstNameInput.value.trim(); const l=lastNameInput.value.trim();
  if(!f||!l){alert('Iltimos ism va familiyangizni kiriting.'); return;}
  state.name.first=f; state.name.last=l; startTest();
});

demoBtn.addEventListener('click',()=>{firstNameInput.value='Ism'; lastNameInput.value='Familiya'; beginBtn.click();});

function startTest(){startScreen.style.display='none'; testArea.style.display='block'; state.idx=0; renderQuestion(0); state.startedAt=Date.now(); startTimer(state.totalSeconds);}

let timerInterval=null;
function startTimer(totalSec){
  let remaining=totalSec;
  updateTimeDisplay(remaining);
  timerInterval=setInterval(()=>{
    remaining--; if(remaining<0){clearInterval(timerInterval); autoFinish(); return;}
    updateTimeDisplay(remaining);
  },1000);
}
function updateTimeDisplay(sec){
  const m=Math.floor(sec/60),s=sec%60;
  timeDisplay.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if(sec<=60) timeDisplay.style.color='#ef4444';
}

function autoFinish(){alert("Vaqt tugadi — test avtomatik yakunlandi."); finalizeAndShowResult();}
finishBtn.addEventListener('click',()=>{if(!confirm('Testni yakunlamoqchimisiz?')) return; saveCurrentSelection(); finalizeAndShowResult();});

function calculateResults(){
  let totalCorrect=0,totalPoints=0,counts={B:0,Q:0,M:0};
  const perQuestion=QUESTIONS.map((q,i)=>{
    const sel=state.answers[i],correct=q.correct,isCorrect=(sel===correct);
    if(isCorrect){totalCorrect++; totalPoints+=Number(q.ballValue); counts[q.ballLabel]=(counts[q.ballLabel]||0)+1;}
    return {id:q.id,selected:sel,correct:correct,isCorrect:isCorrect,ballLabel:q.ballLabel,ballValue:q.ballValue};
  });
  const percent=Math.round((totalCorrect/QUESTIONS.length)*10000)/100;
  return {totalCorrect,totalPoints:Math.round(totalPoints*100)/100,counts,percent,perQuestion};
}

function updateScorePreview(){scorePreview.textContent=calculateResults().totalPoints;}

function finalizeAndShowResult(){
  if(timerInterval) clearInterval(timerInterval);
  const res=calculateResults();
  const wnd=window.open('about:blank','_blank');
  wnd.document.open();
  wnd.document.write(buildResultHtml(res));
  wnd.document.close();
}

function buildResultHtml(res){
  const fnameSafe=(state.name.first+'_'+state.name.last).replace(/[^0-9A-Za-z_\-]/g,'_');
  const dateIso=new Date().toISOString();
  const rowsHtml=QUESTIONS.map((q,i)=>{
    const pr=res.perQuestion[i];
    const selLabel=(pr.selected===null)?'-':String.fromCharCode(65+pr.selected);
    const color=pr.isCorrect?'#22c55e':(pr.selected===null?'#64748b':'#ef4444');
    return `<tr style="background:${color}"><td>${q.id}</td><td>${escapeHtml(q.text)}</td><td>${selLabel}</td><td>${String.fromCharCode(65+q.correct)}</td><td>${q.ballLabel}-${q.ballValue}</td></tr>`;
  }).join('');
  return `
  <html><head><meta charset="utf-8"><title>Natija — ${fnameSafe}</title>
  <style>body{font-family:Inter,"Segoe UI",Arial,sans-serif;background:#f0f8ff;color:#012a4a;padding:16px}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{border:1px solid #cbd5e1;padding:8px;text-align:left}th{background:#0b66ff;color:white}tr{transition:all 0.3s}</style>
  </head><body>
  <h2>OLTIARIQ IXTISOSLASHTIRILGAN MAKTABI</h2>
  <p>O‘quvchi: ${escapeHtml(state.name.first)} ${escapeHtml(state.name.last)}<br>Sanasi: ${dateIso}<br>Jami ball: ${res.totalPoints}</p>
  <table><thead><tr><th>ID</th><th>Savol</th><th>Tanlangan</th><th>To‘g‘ri javob</th><th>Ball</th></tr></thead>
  <tbody>${rowsHtml}</tbody></table>
  </body></html>`;
}
</script>
</body>
</html>
